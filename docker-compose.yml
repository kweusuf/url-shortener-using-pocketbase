version: '3.8'

services:
  url-shortener:
    build: .
    ports:
      - "8090:8090"
    environment:
      - POCKETBASE_DATA_DIR=/app/pb_data
      - POCKETBASE_ENCRYPTION_KEY=${POCKETBASE_ENCRYPTION_KEY:-your-secret-key-change-this}
    volumes:
      - ./pb_data:/app/pb_data
      - ./uploads:/app/uploads  # For any file uploads if needed
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - url-shortener-network

  # Optional: Add a reverse proxy with SSL
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - url-shortener
  #   restart: unless-stopped
  #   networks:
  #     - url-shortener-network

networks:
  url-shortener-network:
    driver: bridge

